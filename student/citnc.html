<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edubridge | Cambridge Institute of Technology – North Campus - Attendance</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 650px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .form-header h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .form-header p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .college-display-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 22px;
        }

        .college-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .college-name-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
        }

        label span {
            font-weight: 400;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 16px;
            background-color: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        input:hover, select:hover {
            border-color: #9ca3af;
        }

        input:focus, select:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }        @media (max-width: 640px) {
            .form-container {
                padding: 25px 20px;
            }
        }

        /* Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            transform: scale(0.92);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .modal-icon.registered {
            background: #dcfce7;
            color: #16a34a;
        }

        .modal-icon.unregistered {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .modal-icon svg {
            width: 32px;
            height: 32px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 10px;
        }

        .modal-message {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .modal-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.25);
        }

        .modal-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <span class="badge">Edubridge</span>
            <h2>College Excellence Program</h2>
            <p>Please fill in your Details to register session attendance.</p>
        </div>

        <form id="attendanceForm" onsubmit="handleFormSubmit(event)">
            
            <!-- College Display -->
            <div class="college-display-card">
                <div class="college-label">College</div>
                <div class="college-name-text">Cambridge Institute Of Technology North Campus</div>
            </div>

            <!-- Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g. Alex Smith">
            </div>

            <!-- Mail ID -->
            <div class="form-group">
                <label for="email">Mail ID</label>
                <input type="email" id="email" name="email" required placeholder="e.g. alex@college.edu">
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
            </div>

            <!-- USN Number -->
            <div class="form-group">
                <label for="usn">USN Number <span>(University Registration Number)</span></label>
                <input type="text" id="usn" name="usn" required placeholder="e.g. 1RV21CS001 or NA" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
            </div>

            <!-- Semester -->
            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="" disabled selected>Select your semester</option>
                    <option value="Sem 1">Sem 1</option>
                    <option value="Sem 2">Sem 2</option>
                    <option value="Sem 3">Sem 3</option>
                    <option value="Sem 4">Sem 4</option>
                    <option value="Sem 5">Sem 5</option>
                    <option value="Sem 6">Sem 6</option>
                    <option value="Sem 7">Sem 7</option>
                    <option value="Sem 8">Sem 8</option>
                </select>
            </div>

            <!-- Stream -->
            <div class="form-group">
                <label for="stream">Stream</label>
                <select id="stream" name="stream" onchange="toggleOtherStream(this)" required>
                    <option value="" disabled selected>Select your stream</option>
                    <option value="CSE">CSE</option>
                    <option value="ISE">ISE</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="AIML">AIML</option>
                    <option value="Mech">Mech</option>
                    <option value="ECE">ECE</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Other Stream (Conditional Field) -->
            <div class="form-group hidden" id="otherStreamGroup">
                <label for="otherStream">Custom Stream Name</label>
                <input type="text" id="otherStream" name="otherStream" placeholder="Type your stream">
            </div>

            <!-- Section -->
            <div class="form-group">
                <label for="section">Section <span>(Select 1 if your stream has no sections)</span></label>
                <select id="section" name="section" required>
                    <option value="" disabled selected>Select section</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <!-- Room Number -->
            <div class="form-group">
                <label for="roomNumber">Room Number <span>(Optional)</span></label>
                <input type="text" id="roomNumber" name="roomNumber" placeholder="e.g. 101 or Lab 2">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit & Continue</button>
        </form>
    </div>

    <!-- Popup Modal Card -->
    <div id="redirectModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon"></div>
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalMessage" class="modal-message"></p>
            <button id="modalOkBtn" class="modal-btn">OK (10s)</button>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { submitAttendanceAndCheckRegistration } from '../js/supabase.js';

        const COLLEGE_NAME = "Cambridge Institute Of Technology North Campus";
        const REDIRECT_URL = "https://www.edubridgeindia.com/college-excellence-program?academy=CAT7&utm_source=CAT7&utm_medium=ECA&utm_campaign=Internal";

        window.toggleOtherStream = function(selectElement) {
            const otherGroup = document.getElementById('otherStreamGroup');
            const otherInput = document.getElementById('otherStream');
            
            if (selectElement.value === 'Other') {
                otherGroup.classList.remove('hidden');
                otherInput.setAttribute('required', 'true');
            } else {
                otherGroup.classList.add('hidden');
                otherInput.removeAttribute('required');
                otherInput.value = '';
            }
        }

        function showRedirectModal(isRegistered, redirectUrl) {
            const modal = document.getElementById('redirectModal');
            const iconContainer = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');
            const okBtn = document.getElementById('modalOkBtn');

            if (isRegistered) {
                iconContainer.className = 'modal-icon registered';
                iconContainer.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`;
                titleEl.textContent = 'Account Found';
                messageEl.textContent = 'Account verified! We found your LMS profile. Redirecting you to sign in...';
            } else {
                iconContainer.className = 'modal-icon unregistered';
                iconContainer.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                titleEl.textContent = 'Account Not Found';
                messageEl.textContent = 'Account not found! Redirecting you to EduBridge LMS. Please sign up to get started.';
            }

            modal.classList.add('active');

            let countdown = 10;
            okBtn.textContent = `OK (${countdown}s)`;

            let redirected = false;
            const navigate = () => {
                if (redirected) return;
                redirected = true;
                clearInterval(timer);
                window.location.href = redirectUrl;
            };

            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    navigate();
                } else {
                    okBtn.textContent = `OK (${countdown}s)`;
                }
            }, 1000);

            okBtn.onclick = navigate;
        }

        window.handleFormSubmit = async function(event) {
            event.preventDefault(); 

            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting Attendance...';

            const streamSelect = document.getElementById('stream').value;
            const finalStream = (streamSelect === 'Other') ? document.getElementById('otherStream').value : streamSelect;

            const formData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                college_name: COLLEGE_NAME,
                usn: document.getElementById('usn').value.trim().toUpperCase(),
                semester: document.getElementById('semester').value,
                stream: finalStream,
                section: document.getElementById('section').value,
                room_number: document.getElementById('roomNumber').value
            };

            try {
                const isRegistered = await submitAttendanceAndCheckRegistration(formData);
                const targetUrl = isRegistered 
                    ? "https://www.edubridgeindia.com/login" 
                    : (REDIRECT_URL || "https://www.edubridgeindia.com/login");

                showRedirectModal(isRegistered, targetUrl);
            } catch (error) {
                console.error('Error!', error);
                alert('Something went wrong. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit & Continue';
            }
        }
    </script>

</body>
</html>
