<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Dashboard | Edubridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased flex flex-col min-h-screen text-slate-800 bg-slate-50">
  
  <!-- Navigation -->
  <nav class="glass sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">E</div>
      <h1 class="text-xl font-bold tracking-tight text-slate-800">Students Dashboard</h1>
    </div>
    <div class="flex gap-4">
      <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">Go to Daily Sync</a>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-1 w-full mx-auto p-4 md:p-6 max-w-7xl">
    
    <div class="flex flex-col mb-6 gap-4">
      <div class="flex gap-2 bg-white p-1 rounded-lg shadow-sm border border-slate-200 w-full overflow-x-auto">
        <button id="tab-attendance" class="px-5 py-2 rounded-md bg-indigo-100 text-indigo-700 font-semibold text-sm shadow-sm transition-all whitespace-nowrap">Attendance</button>
        <button id="tab-unique" class="px-5 py-2 rounded-md bg-white text-slate-600 hover:bg-slate-50 font-semibold text-sm transition-all whitespace-nowrap">Unique Students</button>
        <button id="tab-registered" class="px-5 py-2 rounded-md bg-white text-slate-600 hover:bg-slate-50 font-semibold text-sm transition-all whitespace-nowrap">Registered Students</button>
      </div>

      <!-- Filters & Actions -->
      <div class="flex flex-col md:flex-row flex-wrap items-center justify-between gap-3 w-full bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <!-- Dynamic Filters Container -->
        <div id="dynamic-filters" class="flex flex-wrap gap-2 w-full md:w-auto flex-1">
          <input type="date" id="filter-date" class="hidden px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
          <select id="filter-dropdown" class="hidden px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white min-w-[120px]"></select>
          <select id="filter-stream" class="hidden px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white min-w-[120px]"><option value="">All Streams</option></select>
          <select id="filter-section" class="hidden px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white min-w-[120px]"><option value="">All Sections</option></select>
          <select id="filter-room" class="hidden px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white min-w-[120px]"><option value="">All Rooms</option></select>
        </div>
        
        <!-- Search and Export -->
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="text" id="search-input" placeholder="Search..." class="w-full md:w-64 px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm shadow-sm">
          <button id="btn-export" class="w-full md:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm shadow transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Export CSV
          </button>
        </div>
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse" id="data-table">
          <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200" id="table-head">
            <!-- Headers injected dynamically -->
          </thead>
          <tbody class="text-sm divide-y divide-slate-100" id="table-body">
            <!-- Rows injected dynamically -->
          </tbody>
        </table>
      </div>
      <div id="loading-state" class="p-8 text-center text-slate-500">
        <p>Loading data...</p>
      </div>
      <div id="empty-state" class="hidden p-8 text-center text-slate-500">
        <p>No records found.</p>
      </div>
    </div>

  </main>

  <script type="module" src="js/students-dashboard.js"></script>
</body>
</html>
